version: "3.8"

services:
  forwarder:
    image: python:3.12.6-slim-bookworm
    container_name: adsb-forwarder
    restart: unless-stopped
    user: "10001:10001"
    working_dir: /app
    network_mode: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
    volumes:
      - /opt/adsb-forwarder/forward.py:/app/forward.py:ro
      - type: bind
        source: /run/dump1090-fa
        target: /run/dump1090-fa
        read_only: true
        bind:
          propagation: rshared
      - /var/cache/piaware/feeder_id:/var/cache/piaware/feeder_id:ro
    command: ["python", "/app/forward.py"]
    environment:
      BACKEND_URL: ${BACKEND_URL:?Set BACKEND_URL}
      HMAC_SECRET: ${HMAC_SECRET:?Set HMAC_SECRET}
      INTERVAL_SEC: ${INTERVAL_SEC:-3}
      USE_GZIP: ${USE_GZIP:-1}
      HTTP_TIMEOUT_SEC: ${HTTP_TIMEOUT_SEC:-5}
      SOURCE_FILE: ${SOURCE_FILE:-/run/dump1090-fa/aircraft.json}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c 'import os,sys,time; p=\"/run/dump1090-fa/aircraft.json\"; st=os.stat(p); sys.exit(0 if time.time()-st.st_mtime<60 else 1)' || (echo \"healthcheck failed; forcing restart\" >&2 && kill -s TERM 1)",
        ]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 20s
