services:
  forwarder:
    image: ghcr.io/touchway-track/touchway-adsb-forwarder:${IMAGE_TAG}
    container_name: adsb-forwarder
    restart: unless-stopped
    user: "10001:10001"
    network_mode: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
    volumes:
      - type: bind
        source: /run/dump1090-fa
        target: /run/dump1090-fa
        read_only: true
        bind:
          propagation: rshared
      - /var/cache/piaware:/var/cache/piaware:ro
    command:
      [
        "/bin/sh",
        "-ec",
        ": \"$${BACKEND_URL:?Set BACKEND_URL in /opt/adsb-forwarder/forwarder.env}\"; : \"$${HMAC_SECRET:?Set HMAC_SECRET in /opt/adsb-forwarder/forwarder.env}\"; exec python /app/forward.py",
      ]
    env_file:
      - /opt/adsb-forwarder/forwarder.env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c 'import os,sys,time; p=\"/run/dump1090-fa/aircraft.json\"; st=os.stat(p); sys.exit(0 if time.time()-st.st_mtime<60 else 1)' || (echo \"healthcheck failed; forcing restart\" >&2 && kill -s TERM 1)",
        ]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 20s
