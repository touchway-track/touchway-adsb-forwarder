name: build

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest

      - name: Run pytest
        run: pytest -q

      - name: Resolve validation package version
        id: package_version
        shell: bash
        run: |
          set -euo pipefail
          release_version="$(
            python .github/scripts/next_semver.py |
            awk -F= '$1 == "release_version" { print $2 }'
          )"
          if [[ -n "${release_version}" ]]; then
            echo "package_version=${release_version}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build Debian package
        env:
          PACKAGE_VERSION: ${{ steps.package_version.outputs.package_version }}
        run: python scripts/build_deb.py --output-dir dist

      - name: Inspect Debian package
        shell: bash
        run: |
          set -euo pipefail
          deb_path="$(echo dist/adsb-forwarder_*_all.deb)"
          dpkg-deb -I "${deb_path}"
          dpkg-deb -c "${deb_path}"

      - name: Install package and run smoke test
        shell: bash
        run: |
          set -euo pipefail
          deb_path="$(echo dist/adsb-forwarder_*_all.deb)"
          sample_json="$(mktemp /tmp/adsb-forwarder-aircraft.XXXXXX.json)"
          cp examples/aircraft.sample.json "${sample_json}"
          chmod 644 "${sample_json}"

          sudo apt-get install -y "./${deb_path}"

          sudo tee /etc/adsb-forwarder/forwarder.env >/dev/null <<EOF
          BACKEND_URL=http://127.0.0.1:9
          FEEDER_ID=smoke
          HMAC_SECRET=test
          INTERVAL_SEC=3
          USE_GZIP=1
          HTTP_TIMEOUT_SEC=5
          SOURCE_FILE=${sample_json}
          EOF
          sudo chmod 640 /etc/adsb-forwarder/forwarder.env

          output="$(
            sudo bash -lc '
              set -a
              . /etc/adsb-forwarder/forwarder.env
              set +a
              exec sudo -u adsb-forwarder --preserve-env=BACKEND_URL,FEEDER_ID,HMAC_SECRET,INTERVAL_SEC,USE_GZIP,HTTP_TIMEOUT_SEC,SOURCE_FILE /usr/bin/python3 /usr/lib/adsb-forwarder/forward.py --once
            ' 2>&1
          )"

          printf '%s\n' "${output}"
          grep -Fq "network error while reaching" <<<"${output}"
          grep -Fq "http://127.0.0.1:9" <<<"${output}"

      - name: Verify systemd unit syntax
        run: sudo systemd-analyze verify /lib/systemd/system/adsb-forwarder.service

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_needed: ${{ steps.version.outputs.release_needed }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_version: ${{ steps.version.outputs.release_version }}
      release_bump: ${{ steps.version.outputs.release_bump }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve next semantic version
        id: version
        run: python .github/scripts/next_semver.py >> "$GITHUB_OUTPUT"

      - name: Ensure GitHub release exists
        if: steps.version.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "GitHub release ${RELEASE_TAG} already exists"
            exit 0
          fi

          gh release create "${RELEASE_TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TAG}" \
            --generate-notes

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release.outputs.release_needed == 'true'
    needs:
      - validate
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build release package
        env:
          PACKAGE_VERSION: ${{ needs.release.outputs.release_version }}
        run: python scripts/build_deb.py --output-dir dist

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
        run: gh release upload "${RELEASE_TAG}" dist/*.deb dist/*.sha256 --clobber
