name: build

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest

      - name: Run pytest
        run: pytest -q

      - name: Build Docker image
        run: docker build -t adsb-forwarder:pr .

      - name: Smoke test Docker image
        shell: bash
        run: |
          set -euo pipefail
          output="$(
            docker run --rm \
              -e BACKEND_URL=http://127.0.0.1:9 \
              -e FEEDER_ID=smoke \
              -e SOURCE_FILE=/tmp/aircraft.json \
              -v "$PWD/examples/aircraft.sample.json:/tmp/aircraft.json:ro" \
              --entrypoint python \
              adsb-forwarder:pr \
              /app/forward.py --once \
              2>&1
          )"

          printf '%s\n' "$output"
          grep -Fq "network error while reaching" <<<"$output"

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_needed: ${{ steps.version.outputs.release_needed }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_version: ${{ steps.version.outputs.release_version }}
      release_bump: ${{ steps.version.outputs.release_bump }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve next semantic version
        id: version
        run: python .github/scripts/next_semver.py >> "$GITHUB_OUTPUT"

      - name: Ensure GitHub release exists
        if: steps.version.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "GitHub release ${RELEASE_TAG} already exists"
            exit 0
          fi

          gh release create "${RELEASE_TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TAG}" \
            --generate-notes

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: image
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.release.outputs.release_version }}
        run: |
          set -euo pipefail

          image="ghcr.io/touchway-track/touchway-adsb-forwarder"
          version="sha-${GITHUB_SHA}"
          if [[ -n "${RELEASE_VERSION}" ]]; then
            version="${RELEASE_VERSION}"
          fi

          {
            echo "image=${image}"
            echo "version=${version}"
            echo "tags<<EOF"
            echo "${image}:sha-${GITHUB_SHA}"
            if [[ -n "${RELEASE_TAG}" ]]; then
              echo "${image}:${RELEASE_TAG}"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm/v7,linux/arm64,linux/amd64
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
