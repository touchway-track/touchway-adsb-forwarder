version: "3.8"

services:
  mock-backend:
    image: python:3.12.6-slim-bookworm
    working_dir: /app
    command: ["python", "mock_backend.py"]
    volumes:
      - ./examples/mock_backend.py:/app/mock_backend.py:ro
    ports:
      - "8081:8081"
    restart: unless-stopped

  forwarder:
    image: python:3.12.6-slim-bookworm
    container_name: adsb-forwarder-dev
    working_dir: /app
    command: ["python", "forward.py"]
    restart: unless-stopped
    env_file:
      - ./examples/forwarder.env.example
    environment:
      SOURCE_FILE: /data/aircraft.json
      BACKEND_URL: http://mock-backend:8081/adsb/ingest
    volumes:
      - ./forward.py:/app/forward.py:ro
      - ./examples/aircraft.sample.json:/data/aircraft.json:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    depends_on: [mock-backend]
