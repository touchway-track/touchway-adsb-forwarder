version: "3.8"

services:
  forwarder:
    image: python:3.12.6-slim-bookworm
    container_name: touchway-adsb-forwarder-dev
    working_dir: /app
    command: ["python", "forward.py"]
    restart: unless-stopped
    env_file:
      - ./.docker/dev.env
    volumes:
      - ./forward.py:/app/forward.py:ro
      - ./examples/aircraft.sample.json:/data/aircraft.json:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
