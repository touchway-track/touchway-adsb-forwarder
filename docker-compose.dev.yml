version: "3.8"

services:
  mock-backend:
    image: python:3.12.6-slim-bookworm
    working_dir: /app
    command: ["python", "mock_backend.py"]
    volumes:
      - ./examples/mock_backend.py:/app/mock_backend.py:ro
    ports:
      - "8081:8081"
    restart: unless-stopped

  forwarder:
    image: python:3.12.6-slim-bookworm
    container_name: adsb-forwarder-dev
    working_dir: /app
    command: ["python", "forward.py"]
    restart: unless-stopped
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://mock-backend:8081/adsb/ingest}
      FEEDER_ID: ${FEEDER_ID:-ff-poc-01}
      SITE_ID: ${SITE_ID:-site-poc}
      HMAC_SECRET: ${HMAC_SECRET:-}
      INTERVAL_SEC: ${INTERVAL_SEC:-3}
      USE_GZIP: ${USE_GZIP:-1}
      HTTP_TIMEOUT_SEC: ${HTTP_TIMEOUT_SEC:-5}
      SOURCE_FILE: ${SOURCE_FILE:-/data/aircraft.json}
    volumes:
      - ./forward.py:/app/forward.py:ro
      - ./examples/aircraft.sample.json:/data/aircraft.json:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    depends_on: [mock-backend]
